# Static site: `npm run build` writes everything to dist/. The public pages are plain
# files; every address under /app/ is the same single page (the platform).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The anon key is public and is compiled into the page on purpose; do not let
  # the secrets scanner fail the build over it.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_ANON_KEY,PADDLE_CLIENT_TOKEN"

# Local testing with `netlify dev`: serves the built site in dist/ together with the billing functions on one port.
# Build first (`npm run build`), then `netlify dev`, then open http://localhost:8888.
[dev]
  framework = "#static"
  publish = "dist"
  port = 8888
  autoLaunch = false

# Billing: the Paddle webhook (netlify/functions/paddle-webhook.mjs).
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Share links carry a secret token in the address; never pass it on to other sites.
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"

# The offline service worker must always be fetched fresh so updates reach people.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
